name: Monorepo CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          backend=false
          macos=false
          if [ "$COUNT" -ge 3000 ]; then
            backend=true
            macos=true
          else
            # A version bump (scripts/bump-version.sh) touches the backend and Xcode files on every
            # shipping PR; those version-only edits must not start the backend and macOS jobs.
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '
              .[]
              | select(
                  (.filename | IN("project.yml", "Reader.xcodeproj/project.pbxproj", "Backend/package.json", "Backend/package-lock.json"))
                  and ((.patch // "") | split("\n") | map(select(test("^[+-]"))) | length > 0 and all(test("MARKETING_VERSION|\"version\":")))
                  | not)
              | .filename, (.previous_filename // empty)')
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                Web/*) ;;
                Backend/*) backend=true ;;
                Reader/*|ReaderTests/*|Reader.xcodeproj/*|TestCorpus/*) macos=true ;;
                *) backend=true; macos=true ;;
              esac
            done <<< "$files"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "Backend job: $backend, macOS job: $macos" >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run check

  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          xcodebuild \
            -project Reader.xcodeproj \
            -scheme Reader \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
